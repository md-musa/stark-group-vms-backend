services:
  - type: web
    name: star-group-vms
    runtime: java
    plan: free
    region: oregon

    buildCommand: "./gradlew bootJar -x test"
    startCommand: "java -Dserver.port=$PORT -jar build/libs/star-group-vms-0.0.1-SNAPSHOT.jar"

    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: star-group-vms-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: star-group-vms-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: star-group-vms-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: star-group-vms-db
    plan: free
    region: oregon
    databaseName: stark_group_vms
    user: vms_user
